name: Bug Report
description: Something is broken. Tell us exactly how broken and what you expected instead.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check that this is not a known limitation documented in SECURITY.md. If the bug involves a security vulnerability, do not file here. Email security@vyrox.security instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Be specific. "It doesn't work" is not a bug report.
      placeholder: |
        I sent a CrowdStrike webhook payload to POST /webhook with a valid HMAC
        signature. The ingestion service returned 422. The response body was: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include exact commands and payloads where possible.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Ingestion webhook (FastAPI)
        - AI worker / triage pipeline
        - Discord bot
        - Rust proxy
        - Simulator scripts
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs here. Redact API keys, webhook secrets, and tenant identifiers before pasting.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have redacted all secrets and tenant data from this report.
          required: true
        - label: This is not a security vulnerability. If it is, I will email security@vyrox.security instead.
          required: true